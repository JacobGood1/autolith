name: Build explicit Windows native bundle

description: Build a cl-exec-sandbox helper at an exact revision without touching Qlot state.
inputs:
  revision:
    description: Exact 40-hex cl-exec-sandbox revision; empty disables the candidate.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Build explicit native candidate
      if: inputs.revision != ''
      shell: pwsh
      env:
        SANDBOX_REVISION: ${{ inputs.revision }}
      run: |
        $ErrorActionPreference = 'Stop'
        Set-StrictMode -Version Latest
        if ($env:SANDBOX_REVISION -notmatch '^[0-9a-fA-F]{40}$') {
          throw 'sandbox-revision must be exactly 40 hexadecimal characters.'
        }
        $root = Join-Path $env:RUNNER_TEMP ('cl-exec-sandbox-' + [Guid]::NewGuid().ToString('N'))
        $source = Join-Path $root 'source'
        $bundle = Join-Path $root 'bundle'
        New-Item -ItemType Directory -Force -Path $root | Out-Null
        git clone --quiet --no-checkout https://github.com/lambda-symbolics/cl-exec-sandbox.git $source
        if ($LASTEXITCODE -ne 0) { throw 'Failed to clone cl-exec-sandbox.' }
        git -C $source checkout --quiet --detach $env:SANDBOX_REVISION
        if ($LASTEXITCODE -ne 0) { throw 'The requested cl-exec-sandbox revision is unavailable.' }
        $builder = Join-Path $source 'scripts\build-windows-helper.ps1'
        if (-not (Test-Path -LiteralPath $builder -PathType Leaf)) {
          throw 'The candidate native builder is missing.'
        }
        & $builder -OutputDirectory $bundle
        if ($LASTEXITCODE -ne 0) { throw 'The candidate native bundle build failed.' }
        $helper = Get-ChildItem -LiteralPath $bundle -Filter 'cl-exec-sandbox-windows.exe' -File -Recurse | Select-Object -First 1
        if ($null -eq $helper) { throw 'The candidate bundle did not produce cl-exec-sandbox-windows.exe.' }
        $files = @(Get-ChildItem -LiteralPath $bundle -File -Recurse)
        if ($files.Count -ne 4) { throw "The candidate bundle contains $($files.Count) files, expected four." }
        "CL_EXEC_SANDBOX_WINDOWS_HELPER=$($helper.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "CL_EXEC_SANDBOX_WINDOWS_HELPER=$($helper.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
